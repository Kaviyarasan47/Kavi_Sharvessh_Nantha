<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Passenger Analytics Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f4f7fa;
      margin: 0;
      padding: 0;
      color: #333;
    }
    header {
      background-color: #007acc;
      color: white;
      padding: 20px 40px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }
    header h1 {
      margin: 0;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .chart-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 30px;
    }
    .chart-box {
      flex: 1 1 48%;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    h2 {
      text-align: center;
      margin-top: 50px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 30px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }
    th, td {
      padding: 14px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    th {
      background-color: #f0f0f0;
      font-weight: 600;
    }
    tr:hover {
      background-color: #f9f9f9;
    }
    footer {
      text-align: center;
      padding: 20px;
      margin-top: 50px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <h1>🚗 Passenger Analytics Dashboard</h1>
    <p>Visual breakdown of ride history and fares</p>
  </header>

  <div class="container">
    <div class="chart-section">
      <div class="chart-box">
        <canvas id="fareChart"></canvas>
      </div>
      <div class="chart-box">
        <canvas id="ridePieChart"></canvas>
      </div>
    </div>

    <h2>📊 Passenger Summary Table</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Total Rides</th>
          <th>Total Fare (RM)</th>
          <th>Avg Distance (KM)</th>
        </tr>
      </thead>
      <tbody id="dataTableBody"></tbody>
    </table>
  </div>

  <footer>
    &copy; 2025 E-Hailing Analytics | Powered by Node.js & MongoDB
  </footer>

  <script>
    fetch('/analytics/passengers')
      .then(response => response.json())
      .then(data => {
        // Table
        const tableBody = document.getElementById('dataTableBody');
        data.forEach(item => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${item.name}</td>
            <td>${item.totalRides}</td>
            <td>${item.totalFare.toFixed(2)}</td>
            <td>${item.avgDistance.toFixed(2)}</td>
          `;
          tableBody.appendChild(row);
        });

        // Bar Chart: Total Fare
        const ctxFare = document.getElementById('fareChart').getContext('2d');
        new Chart(ctxFare, {
          type: 'bar',
          data: {
            labels: data.map(p => p.name),
            datasets: [{
              label: 'Total Fare (RM)',
              data: data.map(p => p.totalFare),
              backgroundColor: 'rgba(54, 162, 235, 0.7)',
              borderColor: 'rgba(54, 162, 235, 1)',
              borderWidth: 1
            }]
          },
          options: {
            responsive: true,
            plugins: {
              title: {
                display: true,
                text: 'Total Fare Collected by Passengers',
                font: { size: 16 }
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                title: { display: true, text: 'RM' }
              }
            }
          }
        });

        // Pie Chart: Ride Count Distribution
        const ctxPie = document.getElementById('ridePieChart').getContext('2d');
        new Chart(ctxPie, {
          type: 'pie',
          data: {
            labels: data.map(p => p.name),
            datasets: [{
              label: 'Ride Count',
              data: data.map(p => p.totalRides),
              backgroundColor: ['#4dc9f6', '#f67019', '#f53794', '#537bc4', '#acc236', '#166a8f'],
            }]
          },
          options: {
            responsive: true,
            plugins: {
              title: {
                display: true,
                text: 'Ride Distribution by Passenger',
                font: { size: 16 }
              }
            }
          }
        });

      })
      .catch(error => {
        console.error('Error fetching data:', error);
        alert('Failed to load analytics.');
      });
  </script>
</body>
</html>
